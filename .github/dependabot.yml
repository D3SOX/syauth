version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/syauth-core/fuzz
      - /tools/uniffi-bindgen
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /syauth-android
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
