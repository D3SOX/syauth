name: documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
      - 'scripts/install.sh'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
      - 'scripts/install.sh'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Install the pinned Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Build, check links, and exercise the documentation
        run: python scripts/docs-check.py
      - name: Upload the checked site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syauth-documentation
          path: target/docs-site
          if-no-files-found: error
      - name: Include the shell installer in the published site
        run: cp scripts/install.sh target/docs-site/install.sh
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/docs-site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
