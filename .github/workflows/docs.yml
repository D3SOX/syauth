name: documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.*'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Install the pinned Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Build, check links, and exercise the documentation
        run: python scripts/docs-check.py
      - name: Upload the checked site
        uses: actions/upload-artifact@v4
        with:
          name: syauth-documentation
          path: target/docs-site
          if-no-files-found: error
