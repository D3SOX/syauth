name: release

on:
  push:
    tags: ['v*.*.*']
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate the source version and tag
        id: version
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag/source version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - name: Install the Debian 12 build toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libdbus-1-dev libpam0g-dev libbluetooth-dev libssl-dev python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build locked desktop binaries
        run: cargo build --locked --release -p syauth-cli -p syauth-pam -p syauth-presenced
      - name: Build native packages and manual archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: scripts/build-linux-packages.sh --version "$VERSION" --arch "$ARCH" --binaries target/release --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  install-smoke:
    needs: [version, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            distro: debian
          - runner: ubuntu-24.04
            arch: x86_64
            distro: ubuntu
          - runner: ubuntu-24.04
            arch: x86_64
            distro: fedora
          - runner: ubuntu-24.04
            arch: x86_64
            distro: arch
          - runner: ubuntu-24.04
            arch: x86_64
            distro: opensuse
          - runner: ubuntu-24.04-arm
            arch: aarch64
            distro: debian
          - runner: ubuntu-24.04-arm
            arch: aarch64
            distro: fedora
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install, upgrade, execute, and remove the native package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DISTRO: ${{ matrix.distro }}
          CONTAINER_ENGINE: docker
        run: scripts/test-package-install.sh dist "$VERSION" "$ARCH" "$DISTRO"

  android:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.0.13004108'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build all four native Android libraries and Kotlin bindings
        run: NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108" scripts/build_aar.sh
      - name: Restore the protected release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SYAUTH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/syauth-release.jks"
          echo "SYAUTH_RELEASE_KEYSTORE=$RUNNER_TEMP/syauth-release.jks" >> "$GITHUB_ENV"
      - name: Build, align, sign, and verify the release APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SYAUTH_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SYAUTH_RELEASE_KEYSTORE_PASSWORD }}
          SYAUTH_RELEASE_KEY_ALIAS: syauth
        run: scripts/build-release-apk.sh
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/syauth-release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: target/release-artifacts/*
          if-no-files-found: error

  assemble:
    needs: [version, linux, android, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - name: Assemble source, installer, metadata, and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp scripts/install.sh dist/install.sh
          git archive --format=tar.gz --prefix="syauth-$VERSION/" --output="dist/syauth-$VERSION-source.tar.gz" HEAD
          python3 scripts/release-metadata.py dist --version "$VERSION" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, assemble]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "syauth $TAG" --notes-file deploy/release-notes.md --latest
          # The installer trusts GitHub's per-asset digests; confirm they match the verified build.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' > "$RUNNER_TEMP/github-digests"
          test "$(wc -l < "$RUNNER_TEMP/github-digests")" -eq "$(find dist -maxdepth 1 -type f | wc -l)"
          (cd dist && sha256sum --check --strict "$RUNNER_TEMP/github-digests")
