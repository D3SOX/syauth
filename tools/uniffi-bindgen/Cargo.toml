# The upstream 0.29.5 package exposes the CLI as a library entry point.
[package]
name = "syauth-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.29.5", features = ["cli"] }

[lints.rust]
unsafe_code = "forbid"
