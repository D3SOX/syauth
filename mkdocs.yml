site_name: syauth
site_url: https://d3sox.me/syauth/
site_description: Understand and operate phone-approved Linux authentication.
docs_dir: docs
site_dir: target/docs-site
strict: true
exclude_docs: |
  /security.md
  /known-gaps.md
  /release-process.md
  /perf-baselines.md
theme:
  name: material
  language: en
  logo: assets/syauth.png
  favicon: assets/syauth.png
  font: false
  palette:
    scheme: syauth
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/syauth.css
extra_javascript:
  - javascripts/mechanics.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/D3SOX/syauth
      name: syauth on GitHub
nav:
  - Start here: index.md
  - Fork changes: fork.md
  - Arch Linux and KDE:
      - Install on Arch Linux: getting-started.md
      - sudo and KDE screen unlock: pam.md
      - Approval cancellation: cancellation.md
      - Package update checks: arch-update-check.md
      - Android companion: android-setup.md
      - Bluetooth recovery: bluetooth.md
  - Tutorial:
      - Your first unlock: tutorials/first-unlock.md
  - How-to:
      - Install: how-to/install.md
      - Pair and revoke: how-to/pair-and-revoke.md
      - Troubleshoot: how-to/troubleshoot.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Protocol: reference/protocol.md
      - Glossary: reference/glossary.md
  - Explanation:
      - How it works: explanation/mechanics.md
      - Security: explanation/security.md
  - Contributing:
      - Documentation: contributing/documentation.md
      - Releases: contributing/releases.md
